<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
    }

    .box {
      width: 90%;
      max-width: 400px;
      padding: 35px 20px;
      text-align: center;
      background: white;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      margin-bottom: 25px;
      color: #555;
    }

    .telegram {
      display: block;
      padding: 15px;
      background: #229ED9;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    .telegram:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Welcome ❤️</h1>

    <p>Join us on Telegram</p>

    <a class="telegram"
       href="https://t.me/+ltKX3bBAh0Q0YzY9"
       target="_blank">
       Join Telegram
    </a>
  </div>

</body>
</html>
